site_name: MarkoWizard
site_description: A modern Python library for Markowitz portfolio optimization and analysis.
site_url: https://outliersanalytics.github.io/MarkoWizard/
repo_url: https://github.com/OutliersAnalytics/MarkoWizard
repo_name: OutliersAnalytics/MarkoWizard
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/banner.svg
  favicon: assets/banner.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Web Application: web-app.md
  - API Reference:
      - core: reference/core.md
      - allocation: reference/allocation.md
      - visualization: reference/visualization.md
      - data: reference/data.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
